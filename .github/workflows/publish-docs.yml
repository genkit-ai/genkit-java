name: Publish Docs & Javadoc

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Generate Javadoc
        run: mvn javadoc:aggregate -q

      - name: Install docs dependencies
        working-directory: docs
        run: npm install

      - name: Build docs site
        working-directory: docs
        run: npm run build

      - name: Copy Javadoc into docs output
        run: |
          mkdir -p docs/dist/javadoc
          cp -r target/javadoc/javadoc/* docs/dist/javadoc/ 2>/dev/null || \
          cp -r target/javadoc/apidocs/* docs/dist/javadoc/ 2>/dev/null || \
          cp -r target/site/apidocs/* docs/dist/javadoc/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
