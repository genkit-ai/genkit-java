name: Publish Docs & Javadoc

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          check-latest: true
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Generate Javadoc
        run: mvn javadoc:aggregate -q

      - name: Install docs dependencies
        working-directory: docs
        run: npm install

      - name: Build docs site
        working-directory: docs
        run: npm run build

      - name: Copy Javadoc into docs output
        run: |
          mkdir -p docs/dist/javadoc
          cp -r target/javadoc/javadoc/* docs/dist/javadoc/ 2>/dev/null || \
          cp -r target/javadoc/apidocs/* docs/dist/javadoc/ 2>/dev/null || \
          cp -r target/site/apidocs/* docs/dist/javadoc/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/dist

  deploy:
    # Permissions needed to deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
