version: 2
updates:
  # Enable version updates for Maven dependencies
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "maven"
    assignees:
      - "xavidop"
    # "include: scope" appends "(deps)" itself, so the prefix is the bare type;
    # "chore(deps)" produced "chore(deps)(deps):", which is not a valid
    # conventional commit and which Release Please cannot parse.
    commit-message:
      prefix: "chore"
      include: "scope"
    # One pull request for the weekly minor and patch updates instead of one
    # per dependency, each of which ran every workflow on its own. A major
    # update gets its own pull request, so a breaking upgrade cannot hold the
    # routine ones back.
    groups:
      maven-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # io.weaviate:client 5.6.0 is a relocation stub on Maven Central: a POM
      # with no jar that points at io.weaviate:client6 without a version, so
      # Maven looks for client6:5.6.0, which does not exist. The artifact has
      # moved to client6 (6.x, a different API); taking it is a migration of
      # the Weaviate plugin, not a version bump.
      - dependency-name: "io.weaviate:client"
        versions:
          - ">= 5.6.0"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
